# Fly.io config — run your own HerAndHim in the cloud instead of on a machine
# at home. One instance, one companion, your keys.
#
# This publishes the dashboard on the public internet, so it is gated by an
# access token. Set your own before the first deploy:
#
#   fly secrets set HERANDHIM_WEB_ACCESS_TOKEN="$(openssl rand -base64 32)" --app <your-app>
#
# Without it the container mints a random one on first boot and prints it in
# `fly logs`. The agent's shell tool (run_command) stays off unless you also
# set HERANDHIM_TOOLS_RUN_COMMAND=true.
#
# App name is global on fly.dev — change if "herandhim" is taken.

app             = "herandhim"
primary_region  = "sin"        # pick the region closest to you
swap_size_mb    = 512

[build]
  dockerfile = "Dockerfile"

[env]
  PORT          = "7788"
  HERANDHIM_HOME = "/data"

[http_service]
  internal_port        = 7788
  force_https          = true
  auto_stop_machines   = "off"   # Telegram polling needs always-on; revisit when we switch to webhooks
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "30s"
    method       = "GET"
    path         = "/healthz"      # unauthenticated liveness probe; /api/* needs the token

# One companion needs far less than this; 1 GB leaves headroom for the
# embedding model and photo generation. shared-cpu-1x / 512mb also works.
[[vm]]
  size   = "shared-cpu-2x"
  memory = "1gb"

# Persistent volume for ~/.herandhim/ contents (config, memory, photos, logs).
# Volume is created once via `fly volumes create` (see README) and
# auto-attaches to the machine on every deploy.
[[mounts]]
  source       = "claw_data"
  destination  = "/data"
  initial_size = "1gb"
